# 가챠밥 iOS 클라우드 빌드 (맥 없이 앱스토어 올리기)
#
# 이 파일 하나로 Codemagic이 맥 머신에서 ios/ 프로젝트를 빌드하고
# TestFlight까지 올려준다. 로컬에 Xcode/맥이 없어도 된다.
#
# ── 미리 해둬야 하는 것 (Codemagic 웹에서 1회) ──
# 1) codemagic.io 가입 → GitHub 저장소(jakebae89-create/gacha-lunch) 연결
# 2) App Store Connect에서 API 키 발급
#    (사용자 및 액세스 → 통합 → App Store Connect API → 팀 키 생성, 역할 App Manager)
#    받은 .p8 파일 + Issuer ID + Key ID 를
#    Codemagic → Teams → Integrations → App Store Connect 에 "gachalunch" 이름으로 등록
# 3) App Store Connect에서 앱 레코드를 먼저 만들고(번들 ID com.gachalunch.app),
#    앱 정보 화면의 "Apple ID" 숫자를 아래 APP_STORE_APP_ID 에 적을 것
#
# ── 빌드 실행 ──
# Codemagic 대시보드에서 이 워크플로를 Start new build.
# 성공하면 TestFlight에 자동으로 올라간다.

workflows:
  gachalunch-ios:
    name: 가챠밥 iOS (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      # Codemagic에 등록한 App Store Connect 통합 이름 (2단계에서 지은 이름)
      app_store_connect: gachalunch

    environment:
      groups:
        # Codemagic 웹의 Environment variables 에서 만든 그룹 이름.
        # KAKAO_REST_KEY(카카오 REST API 키)가 여기 들어 있어야 iOS 장소검색이 동작한다.
        - kakao
      ios_signing:
        # 서명 인증서/프로비저닝 프로파일은 Codemagic이 API 키로 알아서 발급·관리한다
        distribution_type: app_store
        bundle_identifier: com.gachalunch.app
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APP_ID: 6799631769 # App Store Connect > 앱 > 앱 정보 > Apple ID
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - name: npm 의존성 설치
        script: npm ci

      - name: 웹 자산 빌드 + iOS 프로젝트 동기화
        script: |
          npm run build:www
          npx cap sync ios   # www/ → ios/App/App/public 복사 + pod install

      - name: 코드 서명 프로파일 적용
        script: xcode-project use-profiles

      - name: 빌드 번호 지정
        script: |
          cd $CM_BUILD_DIR/ios/App
          # TestFlight에 이미 올라간 번호 다음 값을 쓴다 (중복 업로드 거부 방지)
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0)
          agvtool new-version -all $(($LATEST + 1))

      - name: IPA 빌드
        script: |
          cd $CM_BUILD_DIR/ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # 업로드까지만 하고 TestFlight 외부 테스트 심사에는 제출하지 않는다.
        # true로 두면 "Beta App Review Information(이름·전화·이메일)이 없다"며 후처리가 실패한다.
        # 혼자 쓰는 내부 테스트는 이 제출 없이도 바로 설치된다.
        # 외부 테스터를 받을 때 App Store Connect > TestFlight > 테스트 정보를 채우고 true로 바꿀 것.
        submit_to_testflight: false
        # 심사 제출까지 자동으로 하고 싶으면 아래를 true 로.
        # 처음엔 false로 두고 TestFlight에서 직접 확인한 뒤 수동 제출하는 게 안전하다.
        submit_to_app_store: false
